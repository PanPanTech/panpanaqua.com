<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="rasTitle rasDesc">
  <title id="rasTitle">Schematic of a recirculating aquaculture loop</title>
  <desc id="rasDesc">Water moves from the culture tank through solids removal, biological filtration and oxygenation, then returns to the tank.</desc>
  <rect width="720" height="420" fill="transparent"/>
  <circle cx="360" cy="210" r="170" fill="none" stroke="#0A2540" stroke-opacity="0.10" stroke-width="1"/>
  <circle cx="360" cy="210" r="128" fill="none" stroke="#0E4D92" stroke-opacity="0.14" stroke-width="1"/>
  <circle cx="360" cy="210" r="86" fill="none" stroke="#00A3C4" stroke-opacity="0.35" stroke-width="1"/>
  <path d="M250 118 H470 C560 118 610 168 610 210 C610 268 548 312 470 312 H250 C160 312 110 262 110 210 C110 152 172 118 250 118 Z"
        fill="none" stroke="#0A2540" stroke-width="1.7"/>
  <g fill="#F7FAFC" stroke="#0A2540" stroke-width="1.6">
    <rect x="286" y="86" width="148" height="64" rx="2"/>
    <rect x="516" y="178" width="128" height="64" rx="2"/>
    <rect x="286" y="270" width="148" height="64" rx="2"/>
    <rect x="76" y="178" width="128" height="64" rx="2"/>
  </g>
  <g font-family="Source Sans 3, Segoe UI, sans-serif" fill="#0A1628" text-anchor="middle">
    <text x="360" y="114" font-size="15" font-weight="600">Culture tank</text>
    <text x="360" y="132" font-size="11" fill="#3A4A5C">Fish holding water</text>
    <text x="580" y="206" font-size="15" font-weight="600">Solids removal</text>
    <text x="580" y="224" font-size="11" fill="#3A4A5C">Waste and uneaten feed</text>
    <text x="360" y="298" font-size="15" font-weight="600">Biological filter</text>
    <text x="360" y="316" font-size="11" fill="#3A4A5C">Nitrogen conversion</text>
    <text x="140" y="206" font-size="15" font-weight="600">Oxygenation</text>
    <text x="140" y="224" font-size="11" fill="#3A4A5C">Then water returns</text>
  </g>
  <g fill="none" stroke="#FF6B35" stroke-width="1.7" stroke-linecap="square">
    <path d="M434 118 H500"/>
    <path d="M496 112l10 6-10 6"/>
    <path d="M580 242 V270"/>
    <path d="M574 266l6 10 6-10"/>
    <path d="M286 302 H180"/>
    <path d="M190 296l-10 6 10 6"/>
    <path d="M140 178 V148"/>
    <path d="M134 152l6-10 6 10"/>
  </g>
  <text x="360" y="210" text-anchor="middle" font-family="Fraunces, Palatino, serif" font-size="18" fill="#0E4D92">RAS loop</text>
  <text x="360" y="230" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="11" fill="#5A6B7D" letter-spacing="1.5">WATER IS TREATED AND RETURNED</text>
</svg>
